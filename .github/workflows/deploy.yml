# GitHub Actions workflow for AI News daily deployment
# Pipeline pushes news HTML files to the repo, this workflow deploys them to GitHub Pages

name: Deploy AI News

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD)'
        required: false
        default: ''
  repository_dispatch:
    types: [deploy-news]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch all branches so we have the latest pushed files
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Pipeline pushes files to the repo root
      # Upload everything (except .git and workflow files) as the pages artifact
      - name: Prepare pages artifact
        run: |
          mkdir -p public
          # Copy all news files from repo root to public/
          # The pipeline pushes news_YYYY-MM-DD.html to repo root
          for f in *.html; do
            [ -f "$f" ] && cp "$f" public/ && echo "Deployed: $f"
          done
          # Copy news_caster video if present
          for f in *.mp4; do
            [ -f "$f" ] && cp "$f" public/ && echo "Deployed video: $f"
          done
          # Copy deep research reports
          for d in deep_*/; do
            [ -d "$d" ] && mkdir -p "public/$d" && cp "$d"*.html "$d"*.pdf "public/$d" 2>/dev/null || true
          done
          ls -la public/ || echo "No files to deploy"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment URL
        run: |
          echo "Deployed to: ${{ steps.deployment.outputs.page_url }}"
